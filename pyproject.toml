[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectiq"
version = "1.1.0"
description = "FireWireAds evidence-grounded opportunity intelligence portfolio application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "openai>=2.0,<3", "httpx>=0.28,<1",
  "google-cloud-secret-manager>=2.23,<3", "google-cloud-tasks>=2.19,<3",
  "cloud-sql-python-connector[pg8000]>=1.18,<2", "google-genai>=1.0,<2",
  "google-auth>=2.38,<3", "requests>=2.32,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
