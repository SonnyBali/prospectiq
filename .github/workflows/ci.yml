name: Verify Python application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check app tests scripts
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node --check app/static/voice.js
      - run: node --check app/static/analytics.js
      - run: node scripts/test_analytics.mjs
      - run: node scripts/test_private_entry.mjs
      - run: docker build --tag prospectiq:ci .
      - name: Start local credential-free container
        run: >-
          docker run --detach --name prospectiq-ci
          --publish 127.0.0.1:8093:8080
          --env PUBLIC_ORIGIN=http://127.0.0.1:8093
          --env OPENAI_SECRET_NAME=
          --env ADMIN_SECRET_NAME=
          --env ALLOW_CRM_FOLLOWUP=false
          --env ALLOW_CLOUD_TASKS=false
          prospectiq:ci
      - name: Verify real container HTTP workflow
        run: python scripts/smoke_http.py --base-url http://127.0.0.1:8093
      - name: Remove only the CI container
        if: always()
        run: |
          if docker container inspect prospectiq-ci >/dev/null 2>&1; then
            docker container rm --force prospectiq-ci
          fi
      # No deployment, push to a registry, paid API tests, or cloud credentials.
